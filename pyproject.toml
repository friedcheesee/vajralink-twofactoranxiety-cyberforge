[project]
name = "vajra-link"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "bandit>=1.9.4",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "hvac>=2.4.0",
    "jinja2>=3.1.6",
    "openai>=3.42.0",
    "playwright>=1.64.1",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "rich>=15.0.0",
    "semgrep>=1.79.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
vajra-link = "vajra_link:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
